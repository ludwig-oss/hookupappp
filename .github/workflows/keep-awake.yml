name: Keep API awake

on:
  schedule:
    # The free API sleeps after 15 minutes with no traffic. Ping inside that window.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health
        run: curl --retry 5 --retry-delay 3 --retry-all-errors --max-time 50 -fsS "https://hookupappp.onrender.com/api/health" -o /dev/null
