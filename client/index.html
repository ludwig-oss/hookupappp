<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, user-scalable=yes" />
    <meta http-equiv="Permissions-Policy" content="geolocation=*, camera=*, microphone=*" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1a1a2e" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Hook Up – Find Your Match</title>
    <script>
      // Keep Vercel Toolbar off for real users (also set x-vercel-skip-toolbar in vercel.json).
      window.__VERCEL_TOOLBAR_DISABLED = true;
      (function stripVercelToolbar() {
        var kill = function () {
          document.querySelectorAll(
            'vercel-live-feedback, [data-vercel-toolbar], [data-vercel-toolbar-container], iframe[src*="vercel.live"]'
          ).forEach(function (el) { el.remove(); });
        };
        kill();
        if (typeof MutationObserver !== 'undefined') {
          new MutationObserver(kill).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
    <style>
      html, body { margin: 0; min-height: 100vh; background: #1a1a2e; color: #fff; -webkit-text-size-adjust: 100%; }
      #root { min-height: 100vh; }
      @media (min-width: 1024px) {
        body { max-width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#1a1a2e;color:#00d4ff;font-family:system-ui,sans-serif;font-size:18px;">
        Loading app…
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
