# Local PostgreSQL for development (users, posts, chat + RLS).
# Start: docker compose up -d
# Stop:  docker compose down

services:
  postgres:
    image: postgres:16-alpine
    container_name: aswp-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: aswp
      POSTGRES_PASSWORD: aswp_local_dev
      POSTGRES_DB: aswp
    volumes:
      - aswp_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aswp -d aswp"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  aswp_pg_data:
