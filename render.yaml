# Render Blueprint: Web + managed Postgres (DATABASE_URL wired automatically)
# Dashboard: New → Blueprint → connect repo, or sync an existing Blueprint from this file.

databases:
  - name: hookupappp-db
    plan: free

services:
  - type: web
    name: hookupappp
    env: node
    buildCommand: npm run install:all && npm run build:render
    startCommand: NODE_ENV=production node server/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://hookupapp.dev
      - key: PAYPAL_SANDBOX
        value: "true"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: PAYPAL_PARTNER_ID
        sync: false
      - key: PAYPAL_BN_CODE
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: hookupappp-db
          property: connectionString
